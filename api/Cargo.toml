[workspace]
resolver = "3"
members = [
    "crates/layer1-public",
    "crates/layer2-core",
    "crates/layer3-review",
    "crates/layer3-latex",
    "crates/wishpool",
    "crates/verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
wishpool-verifier = { path = "crates/verifier" }
wishpool-core = { path = "crates/layer2-core" }
wishpool-public = { path = "crates/layer1-public" }
wishpool-review = { path = "crates/layer3-review" }
wishpool-latex = { path = "crates/layer3-latex" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
bson = { version = "2.15", features = ["chrono-0_4", "uuid-1"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
mongodb = "3.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
toml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1

# RSA key generation in tests is impractically slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
