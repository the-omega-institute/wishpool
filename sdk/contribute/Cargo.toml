[package]
name = "wishpool-contribute"
description = "Contribute idle model tokens to wishpool: a CLI and an MCP server for your own agent."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[[bin]]
name = "wishpool-contribute"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

