apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishpool-web
  namespace: wishpool
  labels:
    app.kubernetes.io/name: wishpool-web
    app.kubernetes.io/part-of: wishpool
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wishpool-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wishpool-web
        app.kubernetes.io/part-of: wishpool
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/the-omega-institute/wishpool-web:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
