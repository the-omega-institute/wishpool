# Secret names only. Values are provisioned out of band and never committed.
apiVersion: v1
kind: Secret
metadata:
  name: wishpool-api
  namespace: wishpool
  labels:
    app.kubernetes.io/name: wishpool-api
    app.kubernetes.io/part-of: wishpool
type: Opaque
stringData:
  WISHPOOL_MONGODB_URI: ""
  CHRONO_NYXID_CLIENT_ID: ""
  CHRONO_NYXID_CLIENT_SECRET: ""
  # NyxID service-account token for the LLM gateway.
  WISHPOOL_REVIEW_MODEL_TOKEN: ""
  # 32 random bytes, base64; seals donors' delegated refresh tokens.
  WISHPOOL_TOKEN_KEY: ""
  WISHPOOL_OPENALEX_API_KEY: ""
  # Oracle agent key or user token; delegated gateway tokens are not accepted.
  WISHPOOL_ORACLE_TOKEN: ""
