apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishpool-api
  namespace: wishpool
  labels:
    app.kubernetes.io/name: wishpool-api
    app.kubernetes.io/part-of: wishpool
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wishpool-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wishpool-api
        app.kubernetes.io/part-of: wishpool
    spec:
      # Matches the HTTP drain (30 s) plus the review worker's current job.
      terminationGracePeriodSeconds: 65
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/the-omega-institute/wishpool-api:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wishpool-api
            - secretRef:
                name: wishpool-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
