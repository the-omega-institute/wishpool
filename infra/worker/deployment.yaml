# Background workers: LaTeX compilation, machine review, hosted donations,
# lease reconciliation. Exactly one replica owns the TeX cache volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishpool-worker
  namespace: wishpool
  labels:
    app.kubernetes.io/name: wishpool-worker
    app.kubernetes.io/part-of: wishpool
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wishpool-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wishpool-worker
        app.kubernetes.io/part-of: wishpool
    spec:
      terminationGracePeriodSeconds: 65
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/the-omega-institute/wishpool-api:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wishpool-api
            - secretRef:
                name: wishpool-api
          env:
            - name: WISHPOOL_ROLE
              value: "worker"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tex-cache
              mountPath: /var/cache/texmf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tex-cache
          persistentVolumeClaim:
            claimName: wishpool-tex-cache
        - name: tmp
          emptyDir: {}
